<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131711"/>
      <stop offset="55%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ff5c"/>
      <stop offset="100%" stop-color="#b4e62a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- symmetric neon glow accents (kept off-center-bottom-left to respect avatar) -->
  <circle cx="1330" cy="120" r="240" fill="#c8ff3d" opacity="0.12" filter="url(#soft)"/>
  <circle cx="250"  cy="70"  r="190" fill="#c8ff3d" opacity="0.08" filter="url(#soft)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="132" x2="1584" y2="132"/>
    <line x1="0" y1="264" x2="1584" y2="264"/>
    <line x1="528" y1="0" x2="528" y2="396"/>
    <line x1="1056" y1="0" x2="1056" y2="396"/>
  </g>

  <!-- ===== CENTER-SAFE BLOCK (all content within x:300–1284, vertically centered) ===== -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- logo lockup, centered -->
    <circle cx="660" cy="118" r="30" fill="url(#neon)"/>
    <text x="660" y="131" font-size="38" font-weight="800" fill="#0c0c0c" text-anchor="middle">P</text>
    <text x="700" y="132" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1" text-anchor="start">PrepPlace</text>

    <!-- eyebrow -->
    <text x="792" y="192" font-family="'Courier New', monospace" font-size="19" fill="#c8ff3d" letter-spacing="7">PLACEMENT SEASON · OPERATING SYSTEM</text>

    <!-- tagline -->
    <text x="792" y="254" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1">Your placement season, organized.</text>

    <!-- punch line -->
    <text x="792" y="306" font-size="26" font-weight="700" fill="url(#neon)" letter-spacing="2">Prep. Place. Placed.</text>
  </g>
</svg>
