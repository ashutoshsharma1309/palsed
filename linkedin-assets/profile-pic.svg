<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="neonbg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#d8ff5c"/>
      <stop offset="100%" stop-color="#b4e62a"/>
    </radialGradient>
    <filter id="pshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3a5200" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- full neon fill (LinkedIn crops to a circle) -->
  <rect width="1000" height="1000" fill="url(#neonbg)"/>

  <!-- bold P mark -->
  <text x="500" y="700" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="640" font-weight="800" fill="#0c0c0c"
        text-anchor="middle" letter-spacing="-10" filter="url(#pshadow)">P</text>
</svg>
