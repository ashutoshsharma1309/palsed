<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101411"/>
      <stop offset="60%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <filter id="windowshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="screenclip">
      <rect x="120" y="330" width="960" height="600" rx="0"/>
    </clipPath>
    <clipPath id="windowclip">
      <rect x="120" y="270" width="960" height="660" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="980" cy="180" r="260" fill="#c8ff3d" opacity="0.10"/>

  <!-- header -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <circle cx="142" cy="150" r="20" fill="#c8ff3d"/>
    <text x="136" y="159" font-size="24" font-weight="800" fill="#0c0c0c" text-anchor="middle">P</text>
    <text x="174" y="159" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.5">PrepPlace</text>
  </g>

  <!-- browser window -->
  <g filter="url(#windowshadow)">
    <g clip-path="url(#windowclip)">
      <rect x="120" y="270" width="960" height="660" fill="#1b1b1b"/>
      <!-- title bar -->
      <rect x="120" y="270" width="960" height="60" fill="#222222"/>
      <circle cx="156" cy="300" r="8" fill="#ff5f57"/>
      <circle cx="184" cy="300" r="8" fill="#febc2e"/>
      <circle cx="212" cy="300" r="8" fill="#28c840"/>
      <rect x="430" y="286" width="340" height="28" rx="14" fill="#101010"/>
      <!-- real screenshot -->
      <image x="120" y="330" width="960" height="600" preserveAspectRatio="xMidYMin slice"
             xlink:href="site-shot.png"/>
    </g>
    <rect x="120" y="270" width="960" height="660" rx="18" fill="none" stroke="#2e2e2e" stroke-width="1.5"/>
  </g>

  <!-- caption -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="1035" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">Your placement season, organized.</text>
    <text x="600" y="1090" font-size="26" fill="#aaaaaa">85+ recruiters · 150 DSA problems · real PYQs · application tracker</text>
  </g>
</svg>
