<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="g" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#BDFF00" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#BDFF00" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#BDFF00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <circle cx="980" cy="180" r="320" fill="url(#glow)"/>

  <!-- Logo mark (forward caret), top-left, large enough to read at thumb size -->
  <g transform="translate(80,80) scale(2.4)">
    <path d="M11 12 H24 M11 12 V52 M11 52 H24" stroke="#BDFF00" stroke-width="6" stroke-linecap="square" fill="none"/>
    <path d="M31 20 L47 32 L31 44" stroke="#BDFF00" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4" fill="none"/>
  </g>
  <text x="240" y="170" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-2">PREPNEXT</text>

  <!-- Eyebrow -->
  <text x="80" y="330" font-family="'JetBrains Mono', monospace" font-size="22" fill="#BDFF00" letter-spacing="6">· PLACEMENT SEASON OS ·</text>

  <!-- Headline -->
  <text x="80" y="420" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="-3">Crack campus placements.</text>
  <text x="80" y="510" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="48" font-weight="600" fill="#9CA3AF">75 recruiters · PYQs · DSA · Apps tracker</text>

  <!-- CTA pill -->
  <g transform="translate(80,560)">
    <rect width="220" height="44" rx="22" fill="#BDFF00"/>
    <text x="110" y="30" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#000000" text-anchor="middle">prepnext.vercel.app</text>
  </g>

  <!-- Footer mark -->
  <text x="1120" y="600" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4A4A4A" text-anchor="end">For Indian engineering students</text>
</svg>
