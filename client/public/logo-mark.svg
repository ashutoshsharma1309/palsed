<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="PrepNext">
  <!-- The Forward Caret: a code bracket [ enclosing a forward chevron > -->
  <!-- Bracket: three orthogonal strokes forming an open [ -->
  <path d="M11 12 H24 M11 12 V52 M11 52 H24" stroke="currentColor" stroke-width="6" stroke-linecap="square"/>
  <!-- Chevron: forward > with sharp miter point -->
  <path d="M31 20 L47 32 L31 44" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4"/>
</svg>
